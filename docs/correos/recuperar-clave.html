    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#B5450B;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:16px;padding:14px 22px;border-radius:10px">Crear contraseña nueva</a>
